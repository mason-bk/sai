<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사이">
<title>사이 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--text:#20242B;--muted:#566171;--line:#DCE0E6;--control:#7A818C;
  --accent:#2563EB;--action:#2563EB;--out:#C4534D;--in:#3A6BD4;--on-accent:#FFFFFF;--soft:#EDF0F4;--warm:#EDF0F4;--warm-text:#566171;--hero:#FFFFFF;--danger:#B42332;--prev:#7A7F87;
  --backdrop:rgba(20,23,28,.42);--shadow:rgba(20,23,28,.14);
  --danger-fill:#B42332;--on-danger:#FFFFFF;
  --r-card:20px;--r-ctl:14px;--r-item:12px;--r-sheet:24px;--r-pill:999px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;
  --gap:var(--s-2);--stroke:1px solid var(--line);
  --elevation:0 8px 28px var(--shadow);--press:80ms;--motion:180ms;--ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171C;--surface:#20252D;--text:#F2F4F7;--muted:#AAB4C2;--line:#3D4653;--control:#7E8794;
    --accent:#78A9FF;--action:#78A9FF;--out:#EE928C;--in:#8DB4FF;--on-accent:#14171C;--soft:#2A303A;--warm:#2A303A;--warm-text:#AAB4C2;--hero:#20252D;--danger:#FF929C;--prev:#7A8089;
    --danger-fill:#FF929C;--on-danger:#361016;--backdrop:rgba(0,0,0,.65);--shadow:rgba(0,0,0,.35);color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border-radius:var(--r-item)}
button:disabled{cursor:default;opacity:.35;pointer-events:none}
:focus-visible{outline:2px solid var(--action);outline-offset:3px}
.icon{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--s-5)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:var(--s-3) 0 var(--s-2)}
.brand{display:flex;gap:var(--gap);align-items:center;font-weight:800;font-size:22px;letter-spacing:-.02em}
.who{border:0;background:var(--soft);border-radius:var(--r-pill);padding:var(--s-2) 14px;font-size:13px;min-height:44px}
.status{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:18px}
.status.err{color:var(--danger)}
h1{font-size:26px;line-height:1.3;margin:14px 0 var(--s-1);letter-spacing:-.02em}
h2{font-size:18px;margin:var(--s-8) 0 10px;letter-spacing:-.025em}
.hero{border:var(--stroke);background:var(--hero);color:var(--text);border-radius:var(--r-card);padding:18px var(--s-5) var(--s-5);margin-top:14px}
.cyc{display:flex;align-items:center;justify-content:space-between}
.cyc button{background:none;border:0;color:inherit;min-width:44px;min-height:44px;font-size:20px}
.cyc .lbl{text-align:center;font-size:13px;opacity:.9}
.cyc .lbl b{display:block;font-size:15px;opacity:1}
.hero .amt{font-size:38px;font-weight:800;line-height:1.2;margin-top:10px;letter-spacing:-.02em}
.hero .amt small{font-size:18px;font-weight:600;margin-left:2px}
.hero .sub{font-size:13px;opacity:.85;margin-top:6px;display:flex;justify-content:space-between;gap:var(--gap);flex-wrap:wrap}
.card{background:var(--surface);border:var(--stroke);border-radius:var(--r-card);padding:var(--s-1) var(--s-4)}
.bar-row{padding:var(--s-3) 0;border-bottom:var(--stroke)}
.bar-row:last-child{border-bottom:0}
.bar-top{display:flex;justify-content:space-between;font-size:15px}
.bar{height:6px;background:var(--soft);border-radius:var(--r-pill);margin-top:var(--s-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center;padding:var(--s-3) 0;border-bottom:var(--stroke);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:60px}
.tx:last-child{border-bottom:0}
.tx .ic{grid-column:1;grid-row:1 / 3;width:40px;height:40px;border-radius:var(--r-item);background:var(--soft);display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.tx .mid{display:contents}
.tx .m{grid-column:2;grid-row:1;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta{grid-column:2 / -1;grid-row:2;display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tx .a{grid-column:3;grid-row:1;font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.tx .a{color:var(--out)}
.tx .a.ref{color:var(--in)}
.refund-label{display:block;color:var(--muted);font-size:11px;font-weight:500;text-align:right;letter-spacing:0}
.tx .a.ex{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;padding:1px var(--s-2);border-radius:var(--r-pill);background:var(--warm);color:var(--warm-text);margin-left:var(--s-1)}
.tag.q{background:var(--soft);color:var(--muted)}
.day{font-size:12px;color:var(--muted);margin:var(--s-4) 0 0}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px}
.link{background:none;border:0;color:var(--action);font-size:14px;min-height:44px;min-width:44px;padding:0 var(--s-1)}
.chips{display:flex;gap:var(--gap);flex-wrap:wrap}
.chip{border:1px solid transparent;background:var(--soft);border-radius:var(--r-pill);padding:var(--s-2) 14px;min-height:44px;min-width:44px;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--action);color:var(--on-accent)}
.field{margin-top:var(--s-4)}
.field>label,.field>.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in{width:100%;border:var(--stroke);background:var(--surface);border-radius:var(--r-ctl);padding:var(--s-3) 14px;min-height:48px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--gap);width:100%;min-height:54px;border-radius:var(--r-ctl);border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--text);border:0}
.btn.danger{background:var(--soft);color:var(--danger);border:0}
.search{margin-top:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:var(--stroke);box-shadow:0 -4px 20px color-mix(in srgb,var(--shadow) 25%,transparent);
  padding:var(--s-2) max(var(--s-3),calc((100vw - 520px)/2)) calc(var(--s-2) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:5}
nav.tabs button{border-radius:var(--r-ctl);background:none;border:0;min-width:0;min-height:56px;font-size:11px;line-height:1.3;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
nav.tabs .nav-icon{display:grid;place-items:center;width:48px;height:34px;border-radius:var(--r-item)}
nav.tabs button[aria-current=page]{color:var(--action);font-weight:700}
nav.tabs button[aria-current=page] .nav-icon{background:var(--soft)}
/* 가운데 기록 버튼: 다른 탭보다 크게, 탭 바 위로 살짝 올라오게 */
nav.tabs .plus{color:var(--action);font-weight:700;gap:4px;min-height:56px}
nav.tabs .add-icon{display:grid;place-items:center;width:60px;height:60px;margin-top:-26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent),0 0 0 4px var(--surface)}
nav.tabs .add-icon .icon{width:30px;height:30px;stroke-width:2.2}
/* 정기 지출 목록 */
.rule{display:flex;align-items:center;gap:var(--s-2);border-bottom:var(--stroke)}
.rule:last-child{border-bottom:0}
.rule .tx{flex:1;min-width:0;border-bottom:0;background:none;text-align:left;color:inherit;font:inherit}
.rule.off .tx{opacity:.5}
.rule-sw{display:grid;place-items:center;min-width:44px;min-height:44px}
.rule-sw input{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:13px;background:var(--line,#c9ced6);position:relative;transition:background .2s}
.rule-sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease,ease)}
.rule-sw input:checked{background:var(--accent)}
.rule-sw input:checked::after{transform:translateX(18px)}
.rule-sw input:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
/* 예산 */
.budget{margin-top:var(--s-3)}
.budget-h{display:flex;justify-content:space-between;align-items:center;padding-top:var(--s-1)}
.budget-h b{font-size:15px}
.budget .bar-row{padding:var(--s-2) 0 var(--s-3)}
.budget-bar{position:relative;height:8px;overflow:visible}
.budget-bar i{max-width:100%}
.budget-bar.full i{background:var(--out)}
.budget-bar s{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text);opacity:.35;border-radius:1px}
.budget-line{font-size:13px;color:var(--muted);margin-top:6px}
.budget-line b{color:var(--text)}
.budget-line .over{color:var(--out);font-weight:600}
.budget-cta{display:flex;align-items:center;gap:var(--s-2);width:100%;margin-top:var(--s-3);padding:var(--s-3) var(--s-4);border:1px dashed var(--line);border-radius:var(--r-card);background:none;color:var(--action);font-size:14px;font-weight:600;text-align:left}
.budget-cta .muted{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.budget-cat{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3);min-height:52px;border-bottom:var(--stroke)}
.budget-cat:last-child{border-bottom:0}
.budget-cat>span:first-child{display:flex;align-items:center;gap:var(--s-2);font-size:15px}
.budget-cat .icon{width:20px;height:20px;color:var(--muted)}
.budget-in{display:flex;align-items:baseline;gap:4px}
.budget-in input{width:120px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px;text-align:right;padding:6px 2px;color:var(--text);outline:none}
.budget-in input:focus{border-bottom-color:var(--accent)}
.budget-in span{color:var(--muted);font-size:14px}
/* 내역: 목록/달력 */
.list-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3)}
.list-h .lmode{width:132px;flex:none}
.list-h .lmode button{min-height:36px}
.cal{padding:var(--s-3) var(--s-2);margin-top:var(--s-3)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.cal-c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-height:52px;padding:5px 1px;border:0;border-radius:var(--r-item);
  background:color-mix(in srgb,var(--out) var(--lvl,0%),var(--surface));color:var(--text);font:inherit}
.cal-c.pad{background:none}
.cal-c.fut{opacity:.35}
.cal-c.sun .cal-d{color:var(--danger)}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-c.sel{box-shadow:inset 0 0 0 2px var(--text)}
.cal-d{font-size:12px;line-height:1.2}
.cal-a.in{color:var(--in)}
.cal-a{font-size:10.5px;font-weight:700;letter-spacing:-.03em;line-height:1.2;white-space:nowrap}
.cal-z{display:inline-block;width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--accent);opacity:.45}
.cal-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:var(--s-3) var(--s-1) 0}
.cal-legend .cal-z{margin:0 4px 1px 0;vertical-align:middle}

dialog{border:0;padding:0;margin:0;width:100%;max-width:560px;max-height:none;height:var(--vvh,100dvh);background:var(--surface);color:var(--text);inset:0;margin:0 auto}
dialog::backdrop{background:var(--backdrop)}
.sheet-h{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--s-2) + env(safe-area-inset-top)) var(--s-3) var(--s-2);background:var(--surface);border-bottom:var(--stroke);z-index:2}
.sheet-h b{font-size:17px}
.sheet-h button{background:none;border:0;min-height:44px;min-width:60px;font-size:16px;color:var(--muted)}
.sheet-h .save{color:var(--action);font-weight:800}
.sheet-b{padding:var(--s-1) var(--s-5) calc(40px + env(safe-area-inset-bottom));overflow:auto;height:calc(var(--vvh,100dvh) - 61px - env(safe-area-inset-top))}
.more{margin-top:18px;border-top:var(--stroke)}
.more summary{position:relative;padding-right:80px;list-style:none;min-height:52px;display:flex;flex-direction:column;justify-content:center;font-size:14px;color:var(--action);font-weight:600;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'펼치기 +';position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:400}
.more[open] summary::after{content:'접기 −'}
.more summary .sum{font-size:13px;color:var(--muted);font-weight:400}
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding:var(--s-2) 0}
.amount-in input{flex:1;min-width:0;border:0;background:none;font-size:40px;font-weight:800;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amount-in span{font-size:20px;color:var(--muted)}
.seg{padding:var(--s-1);gap:var(--s-1);display:grid;grid-template-columns:repeat(3,1fr);border:0;background:var(--soft);border-radius:var(--r-ctl);overflow:hidden}
.seg button{border-radius:var(--r-item);border:0;background:transparent;min-height:44px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:48px;border:0;border-radius:var(--r-ctl);padding:0 14px;background:var(--soft)}
.toggle input{width:22px;height:22px;accent-color:var(--action)}
.err{color:var(--danger);font-size:13px;margin-top:6px;min-height:18px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px var(--s-4);border-radius:var(--r-pill);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
.center{min-height:80dvh;display:flex;flex-direction:column;justify-content:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin-top:var(--s-5)}
.pick button{min-height:110px;border-radius:var(--r-card);background:var(--surface);border:var(--stroke);font-size:18px;font-weight:700}
/* 분석 홈 */
.seg4{grid-template-columns:repeat(4,1fr);margin-top:var(--s-3)}
.seg4 button{font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin-top:6px;overflow-x:auto}
.filters .chip{display:flex;align-items:center;justify-content:center;gap:var(--s-1);flex:none;min-height:44px;padding:6px 10px;font-size:13px;background:transparent;border-color:transparent;border-radius:var(--r-item)}
.filters .chip[aria-pressed=true]{background:var(--soft);border-color:var(--action);color:var(--action);font-weight:700}
.filters .icon{width:14px;height:14px}
.filters .link{flex:none;font-size:12px;margin-left:auto}
.hero-lab{font-size:13px;opacity:.85;margin-top:var(--s-2)}
.hero .amt{margin-top:2px}
.delta,.pace{font-size:13px;margin-top:6px;opacity:.95}
.pace{padding-top:var(--s-2);border-top:var(--stroke);margin-top:10px}
.h2sub{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px;display:inline-block;line-height:1.5}
.muted{color:var(--muted);font-size:12px}
.pct{color:var(--muted);font-size:12px;min-width:44px;display:inline-block;text-align:right}
.as-btn{display:block;width:100%;background:none;border:0;border-bottom:var(--stroke);text-align:left;padding:var(--s-3) 0;min-height:52px}
.card .as-btn:last-child{border-bottom:0}
.as-btn.on .bar i{background:var(--accent)}
.as-btn.on .bar-top span:first-child{font-weight:700}
.chart-card{padding:var(--s-4) 14px}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.val{fill:var(--text);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.cur{stroke:var(--accent)}
.ln.prev{stroke:var(--prev)}
.area{fill:var(--accent);opacity:.1}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--muted);stroke-width:1;opacity:0}
.xh.on{opacity:1}
.col{fill:color-mix(in srgb,var(--accent) 48%,var(--surface))}
.col.sel{fill:var(--accent)}
.col.run{fill:url(#hatch)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend .key{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tip{max-width:100%;text-align:center;box-shadow:var(--elevation);position:absolute;top:2px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:var(--r-item);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;display:flex;flex-direction:column;align-items:center;z-index:3}
.tip.on{opacity:1}
.tip .muted{color:inherit;opacity:.75}
.tbl summary{font-size:12px;color:var(--action);min-height:44px;display:flex;align-items:center;cursor:pointer}
.tbl table{width:100%;font-size:12px;border-collapse:collapse}
.tbl td{padding:var(--s-1) 0;border-top:var(--stroke)}
.num{text-align:right}
/* 요약 → 일상 기록 → 분석. 기간은 요약 안에서 한 줄로 선택한다. */
.home-hero{margin-top:6px;padding:14px 18px var(--s-2);border-radius:var(--r-card)}
.home-hero .cyc .lbl{text-align:left;opacity:1;display:flex;align-items:baseline;gap:var(--gap);flex-wrap:wrap}
.home-hero .lbl b{font-size:14px;font-weight:600}
.home-hero .lbl>span{font-size:12px;color:var(--muted)}
.cyc-actions{display:flex;flex:none;margin-right:-10px}
.cyc button{display:inline-flex;align-items:center;justify-content:center;padding:0}
.cyc .icon{width:20px;height:20px}
.home-hero .amt{font-size:42px;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.home-hero .amt small{font-size:17px;margin-left:var(--s-1);letter-spacing:0}
.home-hero .sub{margin-top:3px;color:var(--muted);opacity:1;font-size:12px}
.home-hero .delta{font-size:12px;opacity:1;margin-top:var(--s-2)}
.home-hero .delta>span{color:var(--muted)}
