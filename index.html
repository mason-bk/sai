/* 역할 별칭. 일반 지출액은 본문색으로 통일한다. */
:root {
  --amount-expense: var(--text-1);
  --amount-refund: var(--refund);
  --amount-excluded: var(--text-2);
  --surface-sheet: var(--surface-2);
  --surface-input: var(--surface-1);
  --surface-pressed: var(--surface-3);
  --focus-ring: var(--brand);
  --placeholder: var(--text-3);
  --chart-current: var(--brand);
  --chart-previous: var(--text-3);
  --shadow-card: none;
}

@media (width < 360px) {
  :root { --page-gutter: 16px; --hero-padding: 16px; --fs-amount: 2rem; --lh-amount: 1.25; }
}
@media (min-width: 600px) and (max-width: 840px) {
  :root { --page-gutter: 24px; }
}
@media (width > 840px) {
  :root { --page-gutter: 32px; }
}
@media (prefers-contrast: more) {
  :root { --divider: var(--control); --text-3: var(--text-2); --border-width: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-press: 0ms; --motion-release: 0ms; --motion-state: 0ms;

    --text-1: CanvasText; --text-2: CanvasText; --text-3: CanvasText;

    --brand-soft: Canvas; --brand-soft-pressed: Canvas;

    --toast: Canvas; --on-toast: CanvasText; --toast-action: LinkText;
    --shadow-sheet: none; --shadow-toast: none;

}

/* v22 별칭: v21 이름 → v22 역할 (일반 지출액은 --out이 아니라 --amount-expense) */
:root{--r-card:var(--radius-card);--r-ctl:var(--radius-button);--r-item:var(--radius-control);--r-sheet:var(--radius-sheet);--r-pill:var(--radius-pill);
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--gap:var(--s-2);--stroke:1px solid var(--line);
  --surface:var(--surface-1);--soft:var(--surface-2);--text:var(--text-1);--muted:var(--text-3);--line:var(--divider);
  --accent:var(--brand);--action:var(--brand);--on-accent:var(--on-brand);--out:var(--expense);--in:var(--refund);
  --warm:var(--surface-2);--warm-text:var(--text-3);--hero:var(--surface-1);--prev:var(--chart-previous);
  --backdrop:var(--scrim);--elevation:var(--shadow-toast);--shadow:rgb(20 23 28 / .16);
  --press:var(--motion-press);--motion:var(--motion-expand);--ease:var(--ease-enter);--gutter:var(--page-gutter)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:1rem/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border-radius:var(--r-item)}
button:disabled{cursor:default;opacity:.35;pointer-events:none}
:focus-visible{outline:2px solid var(--action);outline-offset:3px}
.icon{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--s-5)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:var(--s-3) 0 var(--s-2)}
.brand{display:flex;gap:var(--gap);align-items:center;font-weight:700;font-size:1.375rem;letter-spacing:-.02em}
.who{border:0;background:var(--soft);border-radius:var(--r-pill);padding:var(--s-2) 14px;font-size:0.8125rem;min-height:44px}
.status{font-size:0.8125rem;color:var(--muted);text-align:center;margin:10px 0 0;min-height:18px}
.status.err{color:var(--danger)}
h1{font-size:1.625rem;line-height:1.3;margin:14px 0 var(--s-1);letter-spacing:-.02em}
h2{font-size:1.125rem;margin:var(--s-8) 0 10px;letter-spacing:-.025em}
.hero{border:var(--stroke);background:var(--hero);color:var(--text);border-radius:var(--r-card);padding:18px var(--s-5) var(--s-5);margin-top:14px}
.cyc{display:flex;align-items:center;justify-content:space-between}
.cyc button{background:none;border:0;color:inherit;min-width:44px;min-height:44px;font-size:1.25rem}
.cyc .lbl{text-align:center;font-size:0.8125rem;opacity:.9}
.cyc .lbl b{display:block;font-size:0.9375rem;opacity:1}
.hero .amt{font-size:2.375rem;font-weight:700;line-height:1.2;margin-top:10px;letter-spacing:-.02em}
.hero .amt small{font-size:1.125rem;font-weight:600;margin-left:2px}
.hero .sub{font-size:0.8125rem;opacity:.85;margin-top:6px;display:flex;justify-content:space-between;gap:var(--gap);flex-wrap:wrap}
.card{background:var(--surface);border:var(--stroke);border-radius:var(--r-card);padding:var(--s-1) var(--s-4)}
.bar-row{padding:var(--s-3) 0;border-bottom:var(--stroke)}
.bar-row:last-child{border-bottom:0}
.bar-top{display:flex;justify-content:space-between;font-size:0.9375rem}
.bar{height:6px;background:var(--soft);border-radius:var(--r-pill);margin-top:var(--s-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center;padding:var(--s-3) 0;border-bottom:var(--stroke);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:60px}
.tx:last-child{border-bottom:0}
.tx .ic{grid-column:1;grid-row:1 / 3;width:40px;height:40px;border-radius:var(--r-item);background:var(--soft);display:grid;place-items:center;font-size:0.9375rem;font-weight:700;flex:none}
.tx .mid{display:contents}
.tx .m{grid-column:2;grid-row:1;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta{grid-column:2 / -1;grid-row:2;display:block;font-size:0.8125rem;color:var(--muted);margin-top:2px}
.tx .a{grid-column:3;grid-row:1;font-size:1rem;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.tx .a{color:var(--out)}
.tx .a.ref{color:var(--in)}
.refund-label{display:block;color:var(--muted);font-size:0.75rem;font-weight:500;text-align:right;letter-spacing:0}
.tx .a.ex{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:0.75rem;padding:1px var(--s-2);border-radius:var(--r-pill);background:var(--warm);color:var(--warm-text);margin-left:var(--s-1)}
.tag.q{background:var(--soft);color:var(--muted)}
.day{font-size:0.8125rem;color:var(--muted);margin:var(--s-4) 0 0}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:0.875rem}
.link{background:none;border:0;color:var(--action);font-size:0.875rem;min-height:44px;min-width:44px;padding:0 var(--s-1)}
.chips{display:flex;gap:var(--gap);flex-wrap:wrap}
.chip{border:1px solid transparent;background:var(--soft);border-radius:var(--r-pill);padding:var(--s-2) 14px;min-height:44px;min-width:44px;font-size:0.875rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--action);color:var(--on-accent)}
.field{margin-top:var(--s-4)}
.field>label,.field>.lab{display:block;font-size:0.8125rem;color:var(--text-2);margin-bottom:6px}
.in{width:100%;border:1px solid var(--control);background:var(--surface);border-radius:var(--r-ctl);padding:var(--s-3) 14px;min-height:48px;font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--gap);width:100%;min-height:54px;border-radius:var(--r-ctl);border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1rem}
.btn.ghost{background:var(--soft);color:var(--text);border:0}
.btn.danger{background:var(--soft);color:var(--danger);border:0}
.search{margin-top:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:var(--stroke);box-shadow:0 -4px 20px color-mix(in srgb,var(--shadow) 25%,transparent);
  padding:var(--s-2) max(var(--s-3),calc((100vw - 520px)/2)) calc(var(--s-2) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:5}
nav.tabs button{border-radius:var(--r-ctl);background:none;border:0;min-width:0;min-height:56px;font-size:0.75rem;line-height:1.3;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
nav.tabs .nav-icon{display:grid;place-items:center;width:48px;height:34px;border-radius:var(--r-item)}

nav.tabs button[aria-current=page] .nav-icon{background:var(--soft)}
/* 가운데 기록 버튼: 다른 탭보다 크게, 탭 바 위로 살짝 올라오게 */

  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent),0 0 0 4px var(--surface)}
nav.tabs .add-icon .icon{width:30px;height:30px;stroke-width:2.2}
/* 정기 지출 목록 */
.rule{display:flex;align-items:center;gap:var(--s-2);border-bottom:var(--stroke)}
.rule:last-child{border-bottom:0}
.rule .tx{flex:1;min-width:0;border-bottom:0;background:none;text-align:left;color:inherit;font:inherit}
.rule.off .tx{opacity:.5}
.rule-sw{display:grid;place-items:center;min-width:44px;min-height:44px}
.rule-sw input{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:13px;background:var(--line,#c9ced6);position:relative;transition:background .2s}
.rule-sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease,ease)}
.rule-sw input:checked{background:var(--accent)}
.rule-sw input:checked::after{transform:translateX(18px)}
.rule-sw input:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.seg.seg2{grid-template-columns:repeat(2,1fr)}

/* ===== v22 레이아웃: 폭 구간 3개(좁음 <600 · 중간 600~840 · 넓음 >840) + safe-area + 키보드 + 금액 맞춤 ===== */
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --nav-h:calc(78px + var(--safe-b));--rail-w:0px;--sheet-top:calc(var(--vvt,0px) + var(--safe-t) + 12px)}
body{padding:var(--safe-t) var(--safe-r) calc(var(--nav-h) + 28px) var(--safe-l)}
.wrap{max-width:560px;padding:0 var(--gutter)}
.results-sticky{margin-inline:calc(-1 * var(--gutter))}.rs-main{padding-inline:var(--gutter)}
/* 좁음: 묶음은 흐름 그대로(내역 합계 줄이 화면 기준으로 붙어 있게) */
.list-side,.list-main,.recur-side,.recur-main,.set-col{display:contents}
/* 아래 탭: 좌우 safe-area 안, 알림은 탭 실제 높이(--nav-h) 위 */
nav.tabs{left:var(--safe-l);right:var(--safe-r);max-width:560px}
.toast{bottom:calc(var(--nav-h) + 24px)} /* 기록 버튼 돌출 12 + 간격 12 */
/* 시트 안 알림은 머리 아래: 아래 주 버튼·키보드와 겹치지 않게 */
.toast.in-sheet{top:auto}
/* 시트: 머리는 상태 막대 아래, 아래 버튼은 홈 막대 위. 키보드가 떠 있으면 홈 막대 여백을 뺀다 */
#sheet{inset:var(--sheet-top) var(--safe-r) auto var(--safe-l);height:calc(var(--vvh,100dvh) - var(--safe-t) - 12px)}
#sheet.filter-sheet{inset:calc(var(--vvt,0px) + var(--vvh,100dvh)) var(--safe-r) auto var(--safe-l);max-height:calc(var(--vvh,100dvh) - var(--safe-t) - 12px)}
.filter-sheet .sheet-b{max-height:none}
.kbd .sheet-footer{padding-bottom:12px}
.kbd #sheet.filter-sheet .sheet-b{padding-bottom:var(--s-4)}
/* 금액: 줄을 바꾸지 않는다. 칸이 좁거나 글자를 키우면 자릿수(--len)에 맞춰 줄인다 */
.amount-in{container-type:inline-size}
b.num,span.num,.num b,.fav-amt,.rs-v b{white-space:nowrap}
.settings-row>.num{flex:none}
.fr-main b{text-overflow:ellipsis}.fr-main b>.icon{flex:none}.fr-main .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favorite-row>b.num{white-space:nowrap}
/* 달력: 좁은 폭(<400)은 카드를 화면 끝까지 넓혀 날짜 칸 44px 이상 */
@media (max-width:399px){
  .card.cal{margin-inline:calc(-1 * var(--gutter));border-radius:0;border-inline:0;padding:8px 2px}
  .cal-g{gap:0}.cal-c{box-shadow:inset 0 0 0 1.5px var(--surface);min-height:54px}
  .cal-c.today{box-shadow:inset 0 0 0 1.5px var(--surface),inset 0 0 0 3.5px var(--accent)}
  .cal-c.sel{box-shadow:inset 0 0 0 1.5px var(--surface),inset 0 0 0 3.5px var(--text)}
}
.cal-hint{text-align:center}
/* 글자를 크게 키워도 아래 탭 글자는 1.5배까지만(아이콘이 길잡이) */
nav.tabs button{font-size:.8125rem}
.chip{min-width:44px}

/* ---- 중간 600~840: 두 칸 ---- */
@media (min-width:600px){
  :root{--sheet-top:calc(var(--vvt,0px) + max(var(--safe-t) + 24px, 6vh))}
  .wrap{max-width:none}
  .screen-home #view,.screen-list #view,.screen-recur #view,.screen-settings #view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;align-items:start}
  #view>.page-title,#view>.fine-print,#view>.analysis-toggle,#view>.analysis{grid-column:1 / -1}
  .home-top{grid-column:1;grid-row:1}.home-cats{grid-column:1;grid-row:2}.home-recent{grid-column:2;grid-row:1 / span 2}
  .home-recent>.section-head{margin-top:0}.home-recent>.section-head h2{line-height:44px}
  .screen-list #view{grid-template-columns:minmax(300px,5fr) minmax(0,7fr)}
  .list-side,.list-main,.recur-side,.recur-main,.set-col{display:block;min-width:0}
  .list-side{position:sticky;top:calc(var(--safe-t) + 8px);max-height:calc(100dvh - var(--safe-t) - var(--nav-h) - 36px);overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 12px;margin:-2px}
  .list-side .results-sticky{position:static;margin:14px 0 0;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden}
  .list-side .rs-main{padding-inline:16px}
  .list-main>.day:first-child{margin-top:4px}
  .list-main>.cal-hint{margin-top:24px}
  .set-col>h2.sec:first-child{margin-top:0}
  .recur-main>.section-head:first-child{margin-top:0}
  nav.tabs{max-width:none;left:var(--safe-l);right:var(--safe-r);padding-inline:max(8px,calc((100% - 560px) / 2))}
  @media (min-width:520px){nav.tabs{border-inline:0}}
  /* 넓은 칸에서는 최근 기록을 더 보여 준다 */
  .home-recent .recent .swipe:nth-child(n+4){display:block}
  .home-recent .recent .swipe:nth-child(3):not(:last-child)::after{display:block}
  /* 시트: 화면 가운데 떠 있는 창(높이는 내용만큼, 키보드 위까지) */
  #sheet,#sheet.filter-sheet{inset:var(--sheet-top) 0 auto 0;margin:0 auto;width:min(480px,calc(100% - 48px));max-width:480px;height:auto;transform:none;
    max-height:calc(var(--vvh,100dvh) - (var(--sheet-top) - var(--vvt,0px)) - max(24px,var(--safe-b)));border-radius:var(--r-sheet)}
  #sheet .sheet-b{flex:1 1 auto}
  .sheet-footer{padding-bottom:16px}
  .analysis{columns:2 300px;column-gap:24px}
  .analysis>*{break-inside:avoid}.analysis>h2{break-after:avoid;margin-top:20px}
  .analysis>.an-hero{margin-top:0}
}
/* ---- 넓음 >840: 옆 메뉴(같은 5개 목적지) + 최대 폭 ---- */
@media (width > 840px){
  :root{--rail-w:calc(96px + var(--safe-l));--nav-h:0px}
  body{padding:var(--safe-t) var(--safe-r) calc(32px + var(--safe-b)) var(--rail-w)}
  .wrap{max-width:1120px}
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:var(--rail-w);max-width:none;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;
    padding:calc(12px + var(--safe-t)) 8px calc(12px + var(--safe-b)) calc(8px + var(--safe-l));border-top:0;border-inline:0;border-right:1px solid var(--line);overflow-y:auto}
  nav.tabs button{min-height:56px;flex:none}
  nav.tabs .plus{margin-block:6px}
  nav.tabs .add-icon{margin-top:0;width:52px;height:52px}
  .toast{bottom:calc(24px + var(--safe-b));left:calc(50% + var(--rail-w) / 2)}
  .list-side{max-height:calc(100dvh - var(--safe-t) - 24px)}
}
@media (min-width:1180px){
  .screen-home #view{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home-top{grid-column:1;grid-row:1 / span 2}.home-recent{grid-column:2;grid-row:1 / span 2}.home-cats{grid-column:3;grid-row:1 / span 2}
  .home-cats>.section-head{margin-top:0}.home-cats>.section-head h2{line-height:44px}
  .analysis{columns:3 300px}
}
/* 가로로 낮은 화면(가로 폰): 위아래 여백을 줄인다 */
@media (max-height:500px) and (min-width:600px){
  header.top{min-height:56px}
  nav.tabs{gap:2px;justify-content:flex-start}
  nav.tabs button{min-height:48px;gap:2px}
  nav.tabs .plus{margin-bottom:4px}
  nav.tabs .add-icon{width:46px;height:46px}
}
/* 폴더블 펼침(접힘선이 세로): 두 칸을 접힘선 양쪽에 하나씩 */
@media (horizontal-viewport-segments:2){
  .wrap{max-width:none}
  .screen-home #view,.screen-list #view,.screen-recur #view,.screen-settings #view{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    column-gap:calc(env(viewport-segment-left 1 0,0px) - env(viewport-segment-right 0 0,0px) + 2 * var(--gutter))}
  .home-top{grid-row:1}.home-cats{grid-column:1;grid-row:2}.home-recent{grid-column:2;grid-row:1 / span 2}
  #sheet,#sheet.filter-sheet{left:env(viewport-segment-left 1 0,50%);right:auto;margin:0;width:env(viewport-segment-width 1 0,50%)}
}

.recent .swipe:nth-child(n+4){display:none}.recent .swipe:nth-child(3)::after{display:none}
span.num.frac{white-space:normal}.frac>span{white-space:nowrap}

   내역은 왼쪽(조건·달력 340) + 오른쪽 목록 320 + 간격 24 = 684px 이상일 때만, 다른 화면은 각 칸 252px 이상(528px)일 때만 */
.wrap{container:page / inline-size}

@container page (max-width:683px){

.cal-g{grid-template-columns:repeat(7,minmax(0,1fr))}.cal-c{min-width:0}
.cal-d{font-size:min(.78125rem,15px)}.cal-a{font-size:min(.71875rem,13.5px)}.cal-w span{font-size:min(.6875rem,13px)}

body{font:var(--fs-body)/var(--lh-body) var(--font);color:var(--text-1)}

.page-title{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:52px;margin:4px 0 16px}
